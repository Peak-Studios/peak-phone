# MERGE INTO YOUR EXISTING server.cfg. This is NOT a full server configuration.
# Keep the existing mysql_connection_string, license key, endpoints and framework config.
# Use exactly one framework (normally already ensured by your existing config):
# ensure qb-core
# ensure qbx_core
# ensure es_extended

# Existing framework / inventory must be started before peak-bridge and peak-phone.
ensure ox_lib
ensure oxmysql
# ensure your-existing-inventory
ensure peak-bridge

# Ordinary phone audio (use only one server voice system):
setr voice_enableCalls 1
ensure pma-voice

# Bundled Peak Duo resources (the order is required by their manifests):
ensure peak-duo-prop
ensure peak-sim-assets

# Optional only for Gallery camera capture and photo upload:
# ensure screenshot-basic
# set phone_media_api_key "YOUR_FIVEMANAGE_API_KEY"

# Optional only for Peakify music:
# ensure xsound

# Video: choose exactly ONE provider. Keys must use set, NEVER setr or sets.
# Cloudflare Realtime > TURN Server > Create: save Token ID and API token privately.
set phone_turn_provider "cloudflare"
# set phone_turn_key_id "YOUR_TURN_TOKEN_ID"
# set phone_turn_api_token "YOUR_TURN_API_TOKEN"

# Alternative self-hosted coturn; do not enable both configurations:
# set phone_turn_provider "coturn"
# set phone_turn_shared_secret "SAME_PRIVATE_RANDOM_SECRET_AS_COTURN_AT_LEAST_32_CHARACTERS"
# set phone_turn_urls '["turn:turn.example.com:3478?transport=udp","turns:turn.example.com:5349?transport=tcp"]'

# Folder must be named peak-phone. Do not start a competing phone item handler.
ensure peak-phone
# Optional: grant Job Creator to members of your existing admin ACE group.
# add_ace group.admin peak.phone.jobs allow
# Run phone_doctor in the server console after startup.
